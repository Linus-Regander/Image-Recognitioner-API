services:
  localstack:
    image: localstack/localstack:4
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      SERVICES: s3,dynamodb,rekognition
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health -o /dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 30s

  terraform:
    image: hashicorp/terraform:1.9
    container_name: terraform-init
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /tf
    volumes:
      - ./terraform:/tf
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        terraform init -input=false &&
        terraform workspace select -or-create=true local &&
        terraform apply -auto-approve -input=false \
        -var local_mode=true \
        -var local_endpoint=http://localstack:4566
    depends_on:
      localstack:
        condition: service_healthy

  app:
    build: .
    container_name: image-recognitioner
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      APP_SECURITY_LOCAL_AUTH_ENABLED: "true"
      APP_AWS_REKOGNITION_ENDPOINT: ${APP_AWS_REKOGNITION_ENDPOINT:-http://localstack:4566}
      APP_AWS_REKOGNITION_MODERATION_MIN_CONFIDENCE: ${APP_AWS_REKOGNITION_MODERATION_MIN_CONFIDENCE:-60.0}
      APP_AWS_REKOGNITION_MODERATION_ENABLED: ${APP_AWS_REKOGNITION_MODERATION_ENABLED:-true}
      APP_AWS_REGION: ${APP_AWS_REGION:-eu-north-1}
      APP_AWS_DYNAMO_DB_TABLE_NAME: ${APP_AWS_DYNAMO_DB_TABLE_NAME:-image-metadata}
      APP_AWS_DYNAMO_DB_ENDPOINT: ${APP_AWS_DYNAMO_DB_ENDPOINT:-http://localstack:4566}
      APP_AWS_S3_BUCKET_NAME: ${APP_AWS_S3_BUCKET_NAME:-image-recognitioner}
      APP_AWS_S3_ENDPOINT: ${APP_AWS_S3_ENDPOINT:-http://localstack:4566}
      APP_AWS_S3_KEY_PREFIX: ${APP_AWS_S3_KEY_PREFIX:-images/}
      APP_AWS_S3_PUBLIC_ENDPOINT: ${APP_AWS_S3_PUBLIC_ENDPOINT:-http://localhost:4566}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    depends_on:
      terraform:
        condition: service_completed_successfully